name: Weekly signal check
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every source
        run: node scripts/check.mjs
      - name: Commit status.json
        run: |
          git config user.name "frequency-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Weekly signal check $(date -u +%Y-%m-%d)"
          git push
